# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transform"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transform"
description = "Designable transformation between declared Xmip Contracts."

[dependencies]
xmip-contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
xmip-message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }