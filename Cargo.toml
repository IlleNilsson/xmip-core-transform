[package]
name = "xmip-core-transform"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transform"
description = "Transformation: one Message's content into a new Message's, by the standard transform units, streamed."

[lib]
# The engines mount beside this source (ADR-0049).
path = ".src/lib.rs"

[features]
# The units' code and what it is built on. Without it the crate is its units'
# declarations alone, which configure reads the standard module by.
default = ["units"]
units = ["dep:message", "dep:codec", "dep:serde", "dep:serde_json", "dep:windows-sys", "dep:libc"]

[dependencies]
# The error is declared once, in core (ADR-0037), and a unit's settings in
# its one shape.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# A unit as its crate declares it, and the stage of the message path it is
# opened at.
node = { package = "xmip-core-node", git = "https://github.com/IlleNilsson/xmip-core-node", branch = "main" }
# The Message transformed, and the Foundation's walk of delimited records.
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main", optional = true }
# XML read a piece at a time by the estate's one XML reader, its escaping,
# and Base 64, spelled once for the estate.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# JSON read a value at a time through visitors that write as they visit,
# and JSON's strings written: the parser the estate already reads with.
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

# A Script runtime's process tree (`script::process_tree`): on Windows the
# job object it runs in, its first thread, read from a snapshot of its own
# threads and let run once it is in the job, and the job terminated (Debug
# and Kernel carry the snapshot's thread entry). The version xmip-core, the
# runtime and secret already build, so nothing new is compiled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ProcessSnapshotting",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }

# On Unix, the process group the runtime leads, killed as one: kill(2).
# In the lock already.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The counting allocator and the one latency spread the estate's tests
# measure with.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main", features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { package = "xmip-core-library-file", git = "https://github.com/IlleNilsson/xmip-core-library-file", branch = "main", features = ["test-support"] }
# A Message for the tests to transform.
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }

[lints.rust]
# deny, not forbid, because forbid cannot be lowered anywhere: the one file
# .src/script/process_tree.rs allows unsafe code with its reason at the top
# (ADR-0050, amendment 2026-09-25; ADR-0066, amendment 2026-11-20), and
# nothing else may. test/Unsafe.Test.ps1 holds the list.
unsafe_code = "deny"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
